server {
  listen 80;
  index index.html;

  location / {
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:9000;
    }

;   location /api/ {
;     proxy_set_header Host $http_host;
;     proxy_pass http://backend:9000;
;     proxy_set_header X-Real-IP $remote_addr;
;   }
;   location /admin/ {
;     proxy_set_header Host $http_host;
;     proxy_pass http://backend:9000/;
;     proxy_set_header X-Real-IP $remote_addr;
;   }

  location /media/ {
    alias /app/media/;
  }

  location / {
    proxy_set_header Host $http_host;
    alias /static/;
    try_files $uri $uri/ /index.html;
  }
}